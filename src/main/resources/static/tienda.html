<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Capriccio - Tienda (Administración)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="sidebar d-flex flex-column p-3 shadow">
        <h3 class="text-center mb-4 text-danger fw-bold">Capriccio</h3>
        <ul class="nav nav-pills flex-column mb-auto">
            <li><a href="/" class="nav-link"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a></li>
            <li><a href="/tienda" class="nav-link active"><i class="bi bi-shop me-2"></i> Tienda</a></li>
            <li><a href="/cocina" class="nav-link"><i class="bi bi-egg-fried me-2"></i> Cocina</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="card shadow-sm border-0 p-4" style="max-width: 600px; margin: 0 auto;">
            <h4 class="text-primary mb-3"><i class="bi bi-plus-circle-fill me-2"></i> Nueva Orden de Producción</h4>
            <p class="text-muted">Solicita productos a cocina para reponer la vitrina de la tienda.</p>
            <hr class="mb-4">
            
            <form id="formOrden">
                <div class="mb-4">
                    <label class="form-label fw-bold">¿Qué producto falta en vitrina?</label>
                    <select class="form-select form-select-lg" id="nombreProducto" required>
                        <option value="Torta de Chocolate">Torta de Chocolate</option>
                    </select>
                </div>
                
                <div class="mb-5">
                    <label class="form-label fw-bold">Cantidad a Preparar (Unidades)</label>
                    <input type="number" class="form-control form-control-lg" id="cantidadSolicitada" min="1" required placeholder="Ej: 5">
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">
                    <i class="bi bi-send-fill me-2"></i> Enviar Orden a Cocina
                </button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('formOrden').addEventListener('submit', async (e) => {
            e.preventDefault(); // Evita que la página recargue
            
            const cantidad = document.getElementById('cantidadSolicitada').value;
            const nombre = document.getElementById('nombreProducto').value;

            // Armamos el objeto con TODOS los campos obligatorios que nos pidió MySQL
            const orden = {
                nombreProducto: nombre,
                cantidadSolicitada: cantidad,
                cantidadAProducir: cantidad, // Mandamos la misma cantidad
                idProducto: 1, // El ID de la Torta de Chocolate que creaste en SQL
                idUsuario: 1,  // El ID del Administrador Antony que acabamos de crear
                estado: "Pendiente"
            };

            try {
                // Enviamos los datos a Java
                const res = await fetch('/api/ordenes', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(orden)
                });

                if(res.ok) {
                    alert("¡Excelente! La orden fue enviada a la cocina exitosamente.");
                    document.getElementById('formOrden').reset(); // Limpia el formulario
                } else {
                    alert("Hubo un error al enviar la orden.");
                }
            } catch (error) {
                console.error("Error de conexión:", error);
            }
        });
    </script>
</body>
</html>
